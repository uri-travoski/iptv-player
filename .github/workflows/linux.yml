name: Linux packages

# When a release is published (a "bump n push" makes one, with the APK built locally), the Linux
# app is built for that tag and its packages are attached to the same release:
#   .deb (Debian, Ubuntu, Mint), .rpm (Fedora, openSUSE), AppImage (any distro), Flatpak bundle.
# Ordinary pushes build nothing. "Run workflow" redoes it for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. 2.38)
        required: true

permissions:
  contents: write

concurrency:
  group: linux-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  packages:
    # The oldest supported Ubuntu: the AppImage's libraries then work on newer systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tools and VLC (to bundle in the AppImage)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libvlc5 vlc-plugin-base libvlc-bin rpm

      - name: Tests and app image
        run: |
          VERSION="${TAG#v}"
          ./gradlew --no-daemon -PdesktopOnly -PappVersion="$VERSION" :desktop:test :desktop:createReleaseDistributable

      - name: .deb, .rpm and AppImage
        run: |
          export VERSION="${TAG#v}"
          desktop/packaging/linux/build-deb.sh
          desktop/packaging/linux/build-rpm.sh
          desktop/packaging/linux/build-appimage.sh
          ls -la desktop/build/dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" desktop/build/dist/* --clobber

      - name: App image for the Flatpak job
        run: tar -C desktop/build/compose/binaries/main-release/app -czf worldtv-app.tar.gz worldtv

      - uses: actions/upload-artifact@v4
        with:
          name: worldtv-app
          path: worldtv-app.tar.gz
          retention-days: 3

  flatpak:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: worldtv-app

      - name: Flatpak tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder

      - name: Flatpak bundle
        run: |
          mkdir -p desktop/build/compose/binaries/main-release/app
          tar -C desktop/build/compose/binaries/main-release/app -xzf worldtv-app.tar.gz
          VERSION="${TAG#v}" desktop/packaging/linux/build-flatpak.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" desktop/build/dist/*.flatpak --clobber
